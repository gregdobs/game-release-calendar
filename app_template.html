<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameCal/26 — Game Release Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script>
/* Apply theme + accent before first paint to avoid a flash. */
(function(){try{
  var t=localStorage.getItem("rel26.theme")||"light";
  if(t==="dark")document.documentElement.classList.add("dark");
}catch(e){}})();
</script>
<style>
:root{--bg:#F5F6F8;--side:#EEF0F3;--card:#FFF;--panel:#FFF;--drawer:#FFF;--past:#F1F2F5;--hover:#EDEFF3;--panel2:#E8EBF0;--line:#E3E6EC;--line2:#DCE0E7;--line3:#D3D8E0;--chip:#E1E5EB;--muted:#B9C0CC;--barf:#AEB6C4;--todayLine:#8fd3b3;--txt:#14171D;--txt2:#23272F;--txt3:#3A404B;--dim:#5A6376;--dim2:#666E80;--faint:#737B8D;--faint2:#8E95A3;--accent:#1F6FD0;--tier2:#B36B00;--onAccent:#FFF;--green:#0B8F59;--onGreen:#FFF;--fbInk:#14171D;--fbShadow:none;--red:#C43D3D;--topbar:rgba(245,246,248,.86);--heroMid:rgba(245,246,248,.84);--heroEnd:rgba(245,246,248,.3);--glass:rgba(255,255,255,.72);--w07:rgba(20,25,40,.06);--w10:rgba(20,25,40,.1);--w16:rgba(20,25,40,.18);color-scheme:light}
html.dark{--bg:#0d0f13;--side:#0b0d10;--card:#121419;--panel:#15181f;--drawer:#13161c;--past:#101216;--hover:#181b23;--panel2:#1c2029;--line:#1f232c;--line2:#232733;--line3:#262b36;--chip:#2a2f3b;--muted:#3a4150;--barf:#4a5468;--todayLine:#2d6b52;--txt:#ECEEF2;--txt2:#DDE1E8;--txt3:#C9CED8;--dim:#9AA3B5;--dim2:#7d8597;--faint:#6B7488;--faint2:#5a6274;--accent:#5AA9FF;--tier2:#F0A92C;--onAccent:#141414;--green:#3DDC97;--onGreen:#08130d;--fbInk:#FFF;--fbShadow:0 2px 18px rgba(0,0,0,.3);--red:#ff8a8a;--topbar:rgba(13,15,19,.86);--heroMid:rgba(13,15,19,.82);--heroEnd:rgba(13,15,19,.35);--glass:rgba(10,12,15,.55);--w07:rgba(255,255,255,.07);--w10:rgba(255,255,255,.1);--w16:rgba(255,255,255,.16);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 'Archivo',system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}a:hover{opacity:.8}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input::placeholder{color:var(--faint)}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2{margin:0;font-size:26px;font-weight:800;font-stretch:115%;letter-spacing:-.02em}
.h1{margin:0;font-size:clamp(38px,4.6vw,56px);line-height:.9;font-weight:850;font-stretch:120%;letter-spacing:-.04em}
.secthd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.secthd .sub{font-size:13px;color:var(--faint)}
.link{border:0;background:none;color:var(--dim);font-size:13px;font-weight:600;margin-left:auto}
.link:hover{color:var(--txt)}
.art{position:relative;aspect-ratio:460/215;overflow:hidden;background-size:cover;background-position:center;padding:0;border:0}
.art>.img{position:absolute;inset:0;background-size:cover;background-position:center}
.art>.fbt{position:absolute;left:0;right:0;text-align:left;font-weight:850;font-stretch:122%;line-height:.92;letter-spacing:-.035em;color:var(--fbInk);text-wrap:balance;text-shadow:var(--fbShadow)}
.tbar{width:3px;border-radius:2px;flex:none}

/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:24px 16px 20px;display:flex;flex-direction:column;gap:26px;background:var(--side)}
.brand{padding:0 8px;display:flex;flex-direction:column;gap:4px}
/* brand: Super Famicom palette (A red, B yellow, Y green, X blue, grey body).
   Underline splices shorten left to right: 40 / 28 / 19 / 13 %. */
.brand>div{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding-bottom:7px;position:relative}
.brand>div::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;
  background:linear-gradient(90deg,#E0262E 0 40%,#F3B70F 40% 68%,#1E9E4A 68% 87%,#2E5BD8 87% 100%)}
.brand b{font-weight:850;font-stretch:125%;font-size:22px;letter-spacing:-.035em}
.brand b span{color:var(--accent)}
.brand .yr{display:inline-flex;align-items:center;gap:4px;border:0;font-weight:700;font-size:13px;color:#4A4C55;background:#C9CAD1;border-radius:6px;padding:2px 6px;margin-left:-2px;box-shadow:inset 0 -2px 0 #A9AAB3}
.brand .yr:hover,.brand .yr.on{background:#BBBCC4}
.brand .yr svg{opacity:.7;transition:transform .15s}.brand .yr.on svg{transform:rotate(180deg)}
html.dark .brand .yr{color:#2A2B31;background:#B7B8C0}
html.dark .brand .yr:hover,html.dark .brand .yr.on{background:#CACBD2}
.yrmenu{position:fixed;z-index:41;min-width:190px;background:var(--panel);border:1px solid var(--line3);border-radius:12px;padding:4px;box-shadow:0 18px 44px rgba(10,14,25,.22);display:flex;flex-direction:column;gap:2px}
.yrmenu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;font-size:13.5px;font-weight:600;color:var(--txt3)}
.yrmenu button:hover{background:var(--hover);color:var(--txt)}
.yrmenu button.on{background:var(--hover);color:var(--txt)}
.yrmenu button.on::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:var(--accent);margin:-2px 0 -2px -4px}
.yrmenu .mono{font-size:15px}
.yrmenu small{margin-left:auto;font-size:11px;color:var(--faint);font-weight:500}
.yrmenu .now{font-size:9.5px;letter-spacing:.1em;font-weight:800;background:var(--green);color:var(--onGreen);padding:2px 5px;border-radius:4px}
.brand small{font-size:12px;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--dim);padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;text-align:left;position:relative}
.nav button:hover{background:var(--hover);color:var(--txt)}
.nav button.on{background:var(--hover);color:var(--txt)}
.nav button.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.nav .badge{margin-left:auto;font-size:11px;color:var(--faint)}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>.lbl{padding:0 12px}
.plat{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:7px 12px;border-radius:8px;font-size:13.5px;color:var(--txt3);text-align:left;width:100%}
.plat:hover{background:var(--hover)}
.plat .box{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--muted);flex:none}
.plat.on{color:var(--txt)}.plat.on .box{background:var(--accent);border-color:var(--accent)}
.plat .cnt{margin-left:auto;font-size:11px;color:var(--faint)}
.filters{display:flex;flex-direction:column;gap:14px;padding:0 12px}
.fld{display:flex;flex-direction:column;gap:7px}
.fld>span{font-size:12px;color:var(--dim)}
.fld>small{font-size:11px;color:var(--faint)}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px}
.seg4 button{border:0;background:transparent;color:var(--dim2);border-radius:6px;padding:5px 0;font-size:11.5px;font-weight:600}
.seg4 button.on{background:var(--chip);color:var(--txt)}
.toggle{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:2px 0;font-size:13px;color:var(--txt3);text-align:left}
.toggle .trk{width:30px;height:18px;border-radius:10px;background:var(--chip);position:relative;flex:none;transition:background .15s}
.toggle .trk::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on .trk{background:var(--accent)}.toggle.on .trk::after{left:14px}
.seg4.tiers{grid-template-columns:repeat(3,1fr)}
.seg4.tiers button{display:flex;align-items:center;justify-content:center;gap:5px}
.seg4.tiers i{width:3px;height:11px;border-radius:2px}
.clr{align-self:flex-start;border:0;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:600}
.prefs{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:4px;gap:2px}
.prefs button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px;border-radius:9px;text-align:left}
.prefs button:hover,.prefs button.on{background:var(--hover)}
.prefs .ico{width:30px;height:30px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;flex:none}
.prefs .ico i{width:12px;height:12px;border-radius:50%}
.prefs .tx{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.prefs .tx small{font-size:11px;color:var(--faint)}
.prefs .tx b{font-size:13px;font-weight:600}
.prefs .chev{color:var(--faint);font-size:16px;padding-right:2px}.prefs button.on .chev{color:var(--accent)}
.sidefoot{margin:0;padding:0 4px;font-size:11px;line-height:1.5;color:var(--faint2)}

.top{position:sticky;top:0;z-index:20;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:14px 36px;display:flex;align-items:center;gap:18px}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:0 12px;height:42px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;background:none;border:0;outline:none;color:var(--txt);font:inherit;font-size:14px;min-width:0}
.search kbd{font:11px 'JetBrains Mono',monospace;color:var(--faint);border:1px solid var(--chip);border-radius:5px;padding:2px 6px}
.today{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.today::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.content{max-width:1360px;margin:0 auto;padding:28px 36px 90px}
.stack{display:flex;flex-direction:column;gap:52px}
.sec{display:flex;flex-direction:column;gap:18px}

/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;background:var(--panel);border:1px solid var(--line2);isolation:isolate}
.hero .blur{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.5);opacity:.5;z-index:-2}
.hero .shade{position:absolute;inset:0;background:linear-gradient(100deg,var(--bg) 8%,var(--heroMid) 45%,var(--heroEnd) 100%);z-index:-1}
.hero .in{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(24px,4vw,48px);padding:clamp(24px,3.5vw,44px);align-items:center}
.hero .l{display:flex;flex-direction:column;gap:22px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--accent)}
.hero h1{margin:0;font-size:clamp(38px,5vw,64px);line-height:.94;font-weight:850;font-stretch:118%;letter-spacing:-.035em;text-wrap:balance;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--w07);border:1px solid var(--w10);color:var(--txt3)}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:4px;max-width:420px}
.cd div{display:flex;flex-direction:column;gap:6px;min-width:0;padding:clamp(10px,1.2vw,14px) clamp(10px,1.2vw,16px) 12px;border-radius:14px;background:var(--glass);border:1px solid var(--w10)}
.cd b{font:500 clamp(28px,3.2vw,44px)/1 'JetBrains Mono',monospace;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cd span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--w16);background:var(--w07);padding:12px 18px;border-radius:11px;font-size:14px;font-weight:600}
.btn:hover{background:var(--w10)}
.btn.pri{border:0;background:var(--accent);color:var(--onAccent);font-weight:700;padding:12px 20px}
.btn.pri.following{background:var(--chip);color:var(--accent)}
.btn.ghost{border:0;background:none;color:var(--txt3);padding:12px 8px}
.hero .r{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero .r .art{border-radius:16px;box-shadow:0 30px 60px rgba(0,0,0,.3),0 0 0 1px var(--w10)}
.hero .r .fbt{bottom:0;padding:0 20px 18px;font-size:clamp(26px,3vw,40px)}
.after{display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--w07);border-radius:14px;padding:6px}
.after .lbl{padding:8px 12px 6px;color:var(--dim)}
.after button{display:flex;align-items:center;gap:14px;border:0;background:none;padding:9px 12px;border-radius:9px;text-align:left;min-width:0}
.after button:hover{background:var(--w07)}
.after .d{font-size:12px;color:var(--accent);width:50px;flex:none}
.after .n{flex:1;font-size:14px;font-weight:600;min-width:0}
.after .rel{font-size:12px;color:var(--dim);flex:none}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:190px}
.day.now{border-color:var(--todayLine)}
.day .hd{display:flex;align-items:baseline;gap:6px;padding:2px 2px 4px}
.day .dw{font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--faint)}
.day .dn{font-size:18px;font-weight:500}
.day.now .dw,.day.now .dn{color:var(--green)}
.day .mr{margin-left:auto;font-size:11px;color:var(--faint)}
.wg{display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;text-align:left;min-width:0}
.wg:hover{opacity:.85}
.wg .art{width:100%;border-radius:8px;box-shadow:inset 0 0 0 1px var(--w07)}
.wg .row{display:flex;gap:7px;align-items:flex-start;min-width:0}
.wg .tbar{height:14px;margin-top:1px}
.wg .nm{font-size:12.5px;line-height:1.25;color:var(--txt2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* year */
.year{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 16px 16px}
.mo{display:flex;flex-direction:column;gap:8px;border:0;background:none;padding:6px 4px;border-radius:10px;text-align:left;min-width:0}
.mo:hover{background:var(--hover)}
.mo .bars{height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.mo .c{font-size:12px;color:var(--faint)}
.mo .b{display:block;border-radius:5px;background:var(--barf)}
.mo.past .b{background:var(--chip)}.mo.past .ml{color:var(--faint)}
.mo.cur .b{background:var(--accent)}.mo.cur .c{color:var(--accent)}.mo.cur .ml{color:var(--txt)}
.mo .ml{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3)}
.mo .tops{display:flex;flex-direction:column;gap:3px;min-height:30px}
.mo .tops span{font-size:10.5px;line-height:1.25;color:var(--dim2)}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px 16px}
.card{display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.card .art{border-radius:14px;box-shadow:0 0 0 1px var(--w07)}
.card .art:hover{box-shadow:0 0 0 2px var(--accent)}
.card .fbt{top:0;padding:14px 50px 0 14px;font-size:22px}
.card .rk{position:absolute;left:0;bottom:0;padding:24px 12px 8px;width:100%;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.75));font:700 26px 'JetBrains Mono',monospace;color:#fff;letter-spacing:-.04em}
.star{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(10,12,15,.7);backdrop-filter:blur(6px);color:#9AA3B5;font-size:15px}
.star.on{color:var(--accent)}
.card .meta{display:flex;flex-direction:column;gap:4px;padding:0 2px}
.card .t{font-size:15px;font-weight:700;line-height:1.25}
.card .s{display:flex;gap:8px;font-size:12.5px;color:var(--dim)}
.card .s .mono{color:var(--accent);font-size:12px}

/* calendar */
.calhd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px}
.calhd .h1 span{color:var(--muted);font-weight:300;margin-left:14px}
.calhd .cnt{font-size:14px;color:var(--dim);padding-bottom:6px}
.calnav{display:flex;gap:6px;padding-bottom:4px;margin-left:auto}
.calnav button{height:38px;min-width:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line3);background:var(--panel);font-size:13px;font-weight:600}
.calnav button.ar{font-size:18px;padding:0}
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.strip button{display:flex;flex-direction:column;gap:6px;border:0;background:transparent;padding:8px 8px 7px;border-radius:9px;text-align:left}
.strip button:hover{background:var(--hover)}
.strip button.sel{background:var(--panel2)}
.strip .t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3)}
.strip .sel .t{color:var(--accent)}.strip .past .t{color:var(--faint)}
.strip .t .mono{font-weight:400;color:var(--faint)}
.strip .tr{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.strip .tr i{display:block;height:100%;background:var(--barf)}
.strip .cur .tr i{background:var(--accent)}.strip .past .tr i{background:var(--chip)}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:12px;color:var(--dim);padding:0 2px}
.legend span{display:flex;align-items:center;gap:6px}
.legend .tbar{height:12px}
.legend .hint{margin-left:auto;color:var(--faint)}
.dows,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dows{margin-bottom:8px}
.dows span{padding:0 10px}
.cell{min-height:156px;min-width:0;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.cell.past{background:var(--past)}
.cell.other{opacity:.3}
.cell.now{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.cell .hd{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.cell .num{font-size:13px;font-weight:500;color:var(--dim)}
.cell.past .num{color:var(--faint2)}.cell.now .num{color:var(--green)}
.tag{font-size:9.5px;letter-spacing:.1em;font-weight:800;background:var(--green);color:var(--onGreen);padding:2px 6px;border-radius:4px}
.cell .art{border-radius:7px;box-shadow:inset 0 0 0 1px var(--w07)}
.cell .art:hover{box-shadow:0 0 0 2px var(--accent)}
.cell.past .art{filter:grayscale(.7) brightness(.8)}
.cell .art .st{position:absolute;top:4px;right:5px;color:var(--accent);font-size:12px;text-shadow:0 1px 3px #000}
.rows{display:flex;flex-direction:column;gap:1px;min-width:0}
.gr{display:flex;align-items:center;gap:6px;border:0;background:none;padding:3px 4px;border-radius:5px;text-align:left;min-width:0;width:100%}
.gr:hover{background:var(--line)}
.gr .tbar{height:13px}
.gr .nm{flex:1;min-width:0;font-size:12px;line-height:1.25;color:var(--txt2)}
.cell.past .gr .nm{color:var(--dim2)}
.gr .st{color:var(--accent);font-size:10px;flex:none}

/* watchlist */
.wrow{display:grid;grid-template-columns:minmax(90px,160px) minmax(140px,1fr) auto auto auto;gap:clamp(10px,1.6vw,22px);align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 18px 10px 10px}

.catch{position:fixed;inset:0;z-index:40}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px;gap:16px}

}

<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div><b>Game<span>Cal</span></b><button class="yr mono" id="yrBtn" data-act="menu" data-v="year" aria-haspopup="listbox" aria-label="Choose year"></button></div>
      <small id="total"></small>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="grp"><div class="lbl">Platforms</div><div id="plats"></div></div>
    <div class="filters" id="filters"></div>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="prefs" id="prefs"></div>
      <p class="sidefoot" id="foot"></p>
    </div>
  </aside>
  <main style="min-width:0">
    <div class="top"><div class="top-in">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--faint)"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="15" y2="15"/></svg>
        <input id="q" type="search" placeholder="Search all years…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="today" id="today"></div>
    </div></div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="drawer"></div>
<div id="menu"></div>

<script>
var DATA = /*__DATA__*/null;
/* ALL = every schedule year; GAMES = the year being viewed (see setYear).
   g.i indexes ALL, so data-i lookups work across years. */
var ALL = DATA.games;
ALL.forEach(function(g,i){ g.i=i; if(g.y==null)g.y=2026; g.s0=g.s; g.src0=g.src; g.ra0=g.ra; g.mc0=g.mc; });
var YEARS = DATA.years||[2026];
var YEAR, GAMES, OC_N;
function setYear(y){
  YEAR=y;GAMES=ALL.filter(function(g){return g.y===y;});
  OC_N=GAMES.filter(function(g){return g.oc;}).length;
}

/* ---------- constants & helpers ---------- */
var GROUPS={PC:["PC","Mac"],PlayStation:["PS5","PS4","PSVR2"],Xbox:["Xbox Series","Xbox One"],Nintendo:["Switch 2","Switch"],Mobile:["iOS","Android"],VR:["Quest","PSVR2"]};
var STORE={steam:"Steam",psn:"PS Store",nintendo:"Nintendo eShop",xbox:"Xbox Store",amazon:"Amazon",gi:"Game Informer"};
var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
var MS=MON.map(function(m){return m.slice(0,3);});
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var THIS_YEAR=new Date().getFullYear();
var SWATCH=[["Blue","#1F6FD0","#5AA9FF"],["Amber","#B36B00","#F0A92C"],["Green","#0B8A57","#3DDC97"],["Violet","#6E4BD8","#A78BFA"],["Coral","#C7402F","#FF7A6B"],["Pink","#BE2F78","#F472B6"]];
var DEF_ACC={light:"#1F6FD0",dark:"#5AA9FF"};
var HUES=[70,250,160,320,25,200];
var TIERS=[["major","Major","var(--accent)","Hype 85+"],["notable","Notable","var(--tier2)","Hype 70–84"],["other","Other","var(--muted)","Hype under 70"]];
function tierOf(g){return g.s>=85?"major":g.s>=70?"notable":"other";}

function pad(n){return String(n).padStart(2,"0");}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function pISO(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function keyOf(g){return g.n+"|"+(g.d||"tba");}
function short(d){if(!d)return"TBA";var x=pISO(d);return MS[x.getMonth()]+" "+x.getDate()+(x.getFullYear()!==YEAR?" ’"+String(x.getFullYear()).slice(2):"");}
function tc(s){return s>=85?"var(--accent)":s>=70?"var(--tier2)":"var(--muted)";}
function fold(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function norm(s){return fold(s).replace(/[^a-z0-9]+/g," ").trim();}
function hash(s){var x=2166136261;for(var i=0;i<s.length;i++)x=Math.imul(x^s.charCodeAt(i),16777619);return x>>>0;}
function ocTier(s){return s>=84?"Mighty":s>=75?"Strong":s>=65?"Fair":"Weak";}
function hexRgb(x){var n=parseInt(x.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function lum(x){var c=hexRgb(x).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function hueOf(x){var c=hexRgb(x).map(function(v){return v/255;}),r=c[0],g=c[1],b=c[2],M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;if(!d)return 0;var h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;return (h*60+360)%360;}

/* ---------- art: Steam CDN layers with generated gradient fallback ---------- */
function sid(g){var m=g.l&&g.l.steam&&g.l.steam.match(/\/app\/(\d+)/);return m?m[1]:null;}
function hasArt(g){return !!(g.img||sid(g));}
function artOf(g){
  var id=sid(g),u=[];
  if(g.img)u.push(g.img);
  if(id){u.push("https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/"+id+"/header.jpg");
         u.push("https://cdn.cloudflare.steamstatic.com/steam/apps/"+id+"/header.jpg");}
  u=u.filter(function(x,i,a){return a.indexOf(x)===i;});
  return u.length?u.map(function(x){return "url("+x.replace(/'/g,"%27").replace(/"/g,"%22")+")";}).join(","):"none";
}
function fbOf(g){
  var k=hash(g.n),a=HUES[k%6],b=(a+40+(k>>3)%90)%360,c=(b+30)%360,ang=100+(k>>13)%80;
  return state.theme==="dark"
    ?"linear-gradient("+ang+"deg,oklch(0.26 0.08 "+a+") 0%,oklch(0.48 0.17 "+b+") 58%,oklch(0.68 0.16 "+c+") 100%)"
    :"linear-gradient("+ang+"deg,oklch(0.96 0.035 "+a+") 0%,oklch(0.86 0.09 "+b+") 55%,oklch(0.76 0.13 "+c+") 100%)";
}
function bgOf(g){var a=artOf(g);return (a==="none"?"":a+",")+fbOf(g);}
/* art block: gradient + optional title under the image layer, image on top */
function artHTML(g,cls,title,extra,act){
  return "<button class=\"art "+(cls||"")+"\" data-act=\""+(act||"open")+"\" data-i=\""+g.i+"\" title=\""+esc(g.n)+"\" style=\"background-image:"+fbOf(g)+"\">"+
    (title?"<span class=\"fbt\">"+esc(g.n)+"</span>":"")+
    "<span class=\"img\" style=\"background-image:"+artOf(g)+"\"></span>"+(extra||"")+"</button>";
}

/* ---------- state ---------- */
var NOW=new Date();
var store={};
try{
  store.watch=JSON.parse(localStorage.getItem("rel26.watch")||"null");
  store.theme=localStorage.getItem("rel26.theme")||"light";
  store.accent=Object.assign({},DEF_ACC,JSON.parse(localStorage.getItem("rel26.accent")||"{}"));
  store.key=localStorage.getItem("gamecal.rawgKey")||"";
  store.cache=JSON.parse(localStorage.getItem("gamecal.rawgCache")||"{}");
  store.useLive=localStorage.getItem("gamecal.useLive")!=="0";
  store.year=+localStorage.getItem("rel26.year");
}catch(e){}
/* open on the remembered year, else this year, else the closest one we have */
setYear(YEARS.indexOf(store.year)>-1?store.year:YEARS.indexOf(THIS_YEAR)>-1?THIS_YEAR:
  YEARS.slice().sort(function(a,b){return Math.abs(a-THIS_YEAR)-Math.abs(b-THIS_YEAR);})[0]);
function monthFor(y){return y===THIS_YEAR?NOW.getMonth():0;}
var state={view:"next",m:monthFor(YEAR),plats:[],minOc:0,tiers:["major","notable","other"],q:"",
  sel:null,watch:store.watch,open:{},tbaOpen:false,menu:null,theme:store.theme||"light",accent:store.accent||DEF_ACC,
  rkey:store.key||"",rstatus:"",rerr:false,rbusy:false,rprog:0,live:false,useLive:store.useLive!==false};
var cache=store.cache||{};
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function todayISO(){var t=new Date();t.setHours(0,0,0,0);return iso(t);}
if(!state.watch){
  var T0=todayISO();
  state.watch=ALL.filter(function(g){return g.d&&g.d>=T0;}).sort(function(a,b){return b.s-a.s;}).slice(0,3).map(keyOf);
  lsSet("rel26.watch",JSON.stringify(state.watch));
}
function isW(g){return state.watch.indexOf(keyOf(g))>-1;}
function toggleWatch(g){
  var k=keyOf(g);
  state.watch=isW(g)?state.watch.filter(function(x){return x!==k;}):state.watch.concat([k]);
  lsSet("rel26.watch",JSON.stringify(state.watch));
}
function visible(g){
  if(state.plats.length&&!state.plats.some(function(grp){return GROUPS[grp].some(function(p){return g.p.indexOf(p)>-1;});}))return false;
  if(state.minOc&&!(g.oc>=state.minOc))return false;
  if(state.tiers.length<3&&state.tiers.indexOf(tierOf(g))<0)return false;
  return true;
}
function rel(d){
  if(!d)return"date TBA";
  var t=new Date();t.setHours(0,0,0,0);
  var df=Math.round((pISO(d)-t)/864e5);
  return df===0?"today":df===1?"tomorrow":df===-1?"yesterday":df>0?"in "+df+" days":(-df)+" days ago";
}

/* ---------- theme ---------- */
function applyTheme(){
  var r=document.documentElement,t=state.theme,a=state.accent[t];
  r.classList.toggle("dark",t==="dark");
  r.style.setProperty("--accent",a);
  r.style.setProperty("--onAccent",lum(a)>0.4?"#141414":"#FFFFFF");
  var nearBlue=Math.abs(hueOf(a)-215)<45;
  r.style.setProperty("--tier2",nearBlue?(t==="dark"?"#F0A92C":"#B36B00"):(t==="dark"?"#5AA9FF":"#1F6FD0"));
}

/* ---------- .ics export ---------- */
function ics(list){
  var st=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  var e=function(s){return String(s).replace(/([,;\\])/g,"\\$1");};
  var f=function(d){return iso(d).replace(/-/g,"");};
  var ev=list.filter(function(g){return g.d;}).map(function(g){
    var a=pISO(g.d),b=new Date(a);b.setDate(a.getDate()+1);
    return ["BEGIN:VEVENT","UID:"+norm(g.n).replace(/ /g,"-")+"-"+f(a)+"@gamecal","DTSTAMP:"+st,
      "DTSTART;VALUE=DATE:"+f(a),"DTEND;VALUE=DATE:"+f(b),"SUMMARY:"+e(g.n+" releases"),
      "DESCRIPTION:"+e(g.p.join(", ")),"END:VEVENT"].join("\r\n");
  });
  var txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//GameCal//EN","CALSCALE:GREGORIAN"].concat(ev,["END:VCALENDAR"]).join("\r\n");

    (g.alt&&g.alt.length?"<div class=\"alt\"><span class=\"lbl\">Other platform dates</span>"+g.alt.map(function(a){return "<div>"+esc(a.p.join(", "))+"<span class=\"mono\">"+short(a.d)+"</span></div>";}).join("")+"</div>":"")+
    "<div style=\"display:flex;flex-direction:column;gap:8px\"><span class=\"lbl\">Where to buy</span><div class=\"stores\">"+Object.keys(g.l).map(function(k){
      return "<a href=\""+esc(g.l[k])+"\" target=\"_blank\" rel=\"noopener\">"+(STORE[k]||k)+"<span>↗</span></a>";}).join("")+"</div></div>"+
    "<p class=\"note\">"+note+"</p></div></aside>";
}

/* ---------- appearance / ranking menus (shared flyout) ---------- */
function renderMenu(){
  var box=document.getElementById("menu");
  if(!state.menu){box.innerHTML="";return;}
  if(state.menu==="year"){
    var r=document.getElementById("yrBtn").getBoundingClientRect();
    box.innerHTML="<div class=\"catch\" data-act=\"closeMenu\"></div><div class=\"yrmenu\" role=\"listbox\" aria-label=\"Year\" style=\"left:"+Math.round(r.left)+"px;top:"+Math.round(r.bottom+8)+"px\">"+
      YEARS.map(function(y){
        var n=ALL.filter(function(g){return g.y===y;}).length;
        return "<button role=\"option\" aria-selected=\""+(y===YEAR)+"\" class=\""+(y===YEAR?"on":"")+"\" data-act=\"year\" data-v=\""+y+"\"><span class=\"mono\">"+y+"</span>"+
          (y===THIS_YEAR?"<span class=\"now\">NOW</span>":"")+"<small class=\"mono\">"+n+" games</small></button>";
      }).join("")+"</div>";
    return;
  }
  var rank=state.menu==="rank",t=state.theme,cur=state.accent[t];
  var seg2=function(opts){return "<div class=\"seg2\">"+opts.map(function(o){return "<button class=\""+(o[2]?"on":"")+"\" data-act=\""+o[0]+"\">"+o[1]+"</button>";}).join("")+"</div>";};
  var body;
  if(rank){
    body="<div class=\"fsec\"><span class=\"lbl\">Source</span>"+seg2([["srcEd","Editorial",!state.live],["fetch","Live RAWG",state.live]])+
      "<p>"+(state.live?"RAWG tracking counts, blended with OpenCritic (60%) and Metacritic (40%) where reviewed. Unmatched titles keep their editorial score.":"Built-in hype score from franchise weight (ports and spin-offs discounted), platform reach and critic reviews (OpenCritic 60%, Metacritic 40%).")+"</p></div>"+
      "<div class=\"fsec\"><div style=\"display:flex;align-items:baseline\"><span class=\"lbl\" style=\"flex:1\">RAWG API key</span><a href=\"https://rawg.io/apidocs\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;font-weight:600;text-decoration:none\">Get a free key ↗</a></div>"+
      "<div class=\"krow\"><input type=\"password\" id=\"keyInput\" placeholder=\"Paste key\" autocomplete=\"off\" spellcheck=\"false\" value=\""+esc(state.rkey)+"\"><button class=\"sbtn\" data-act=\"saveKey\">Save &amp; test</button></div>"+
      "<div style=\"display:flex;align-items:center;gap:6px;margin-top:4px\"><button class=\"fetch\" data-act=\"fetch\""+(state.rbusy?" disabled":"")+">"+(state.rbusy?"Fetching…":state.live?"Refresh live ranking":"Fetch live ranking")+"</button><button class=\"txtbtn\" data-act=\"clearKey\">Clear</button></div>"+
      (state.rbusy?"<span class=\"pbar\"><i id=\"pfill\" style=\"width:"+Math.round(state.rprog*100)+"%\"></i></span>":"")+
      "<span class=\"status"+(state.rerr?" err":"")+"\" id=\"rstatus\">"+state.rstatus+"</span></div>";
  } else {
    var match=false;
    body="<div class=\"fsec\"><span class=\"lbl\">Theme</span>"+seg2([["themeL","Light",t==="light"],["themeD","Dark",t==="dark"]])+"</div>"+
      "<div class=\"fsec\" style=\"gap:10px\"><span class=\"lbl\">Accent · "+t+" mode</span><div class=\"sw\">"+SWATCH.map(function(x){
        var c=x[t==="dark"?2:1],on=c.toLowerCase()===cur.toLowerCase();if(on)match=true;
        return "<button class=\""+(on?"on":"")+"\" style=\"background:"+c+";--ring:"+c+"\" title=\""+x[0]+"\" data-act=\"accent\" data-v=\""+c+"\"></button>";
      }).join("")+"<label class=\"CUSTOM\" title=\"Custom color\" style=\"--ring:var(--accent)\"><input type=\"color\" id=\"customColor\" value=\""+cur+"\"></label></div></div>";
    body=body.replace("class=\"CUSTOM\"",match?"":"class=\"on\"");
  }
  box.innerHTML="<div class=\"catch\" data-act=\"closeMenu\"></div><div class=\"fly\" role=\"dialog\">"+
    "<div class=\"fh\"><div><b>"+(rank?"Ranking source":"Appearance")+"</b><span>"+(rank?"Decides the order of games in each day, Up next and Most anticipated.":"Theme and accent color for the whole app.")+"</span></div><button class=\"fx\" data-act=\"closeMenu\" aria-label=\"Close\">×</button></div>"+
    "<div class=\"fb\">"+body+"</div>"+
    "<div class=\"ff\">"+(rank?"Your key stays in this browser's localStorage and is never written into index.html. Results are cached, so a full fetch (~"+ALL.length+" requests, all years) is paid once.":"Light and dark each keep their own accent. Notable releases switch to a contrasting color automatically.")+"</div></div>";
}

function render(){
  renderSide();
  var v=document.getElementById("view");
  v.innerHTML=state.q.trim()?viewSearch():state.view==="cal"?viewCal():state.view==="watch"?viewWatch():viewNext();
  renderDrawer();renderMenu();
}

/* ---------- live RAWG ranking ---------- */
function similar(a,b){
  a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 1;
  var bg=function(s){var o=[];for(var i=0;i<s.length-1;i++)o.push(s.slice(i,i+2));return o;};
  var A=bg(a),B=bg(b),used={},hit=0;
  for(var i=0;i<A.length;i++)for(var j=0;j<B.length;j++)if(!used[j]&&A[i]===B[j]){used[j]=1;hit++;break;}
  return 2*hit/(A.length+B.length);
}
function lookup(name,key){
  return fetch("https://api.rawg.io/api/games?key="+encodeURIComponent(key)+"&search="+encodeURIComponent(name)+"&page_size=5").then(function(r){
    if(r.status===401||r.status===429)throw new Error(String(r.status));
    if(!r.ok)throw new Error("HTTP "+r.status);return r.json();
  }).then(function(j){
    var best=null,bs=0;(j.results||[]).forEach(function(it){var s=similar(name,it.name||"");if(s>bs){best=it;bs=s;}});
    return best&&bs>=0.82?{added:best.added||0,mc:best.metacritic||null}:{added:0,miss:1};
  });
}
/* RAWG omits CORS headers on errors, so a bad key looks like "Failed to fetch".
   The keyless root endpoint does send them: reachable => bad key, else offline. */
function explain(err){
  if(String(err&&err.message)==="429")return Promise.resolve("RAWG rate limit hit. Wait a minute and retry.");
  return fetch("https://api.rawg.io/api/").then(function(r){return r.ok;}).catch(function(){return false;})
    .then(function(up){return up?"That key was rejected by RAWG.":"Can't reach RAWG. Check your connection.";});
}
function say(msg,err){state.rstatus=msg;state.rerr=!!err;var el=document.getElementById("rstatus");if(el){el.textContent=msg;el.className="status"+(err?" err":"");}}
function saveCache(){try{localStorage.setItem("gamecal.rawgCache",JSON.stringify(cache));}catch(e){say("Couldn't save the cache (storage full or blocked).",true);}}
/* Enhanced score: log-normalised RAWG popularity blended with critics.
   Critics = OpenCritic (60%) + Metacritic (40%) over whichever exist;
   critic weight is 25% with both, 18% with one, 0 with none. */
function applyScores(){
  var vals=[];ALL.forEach(function(g){var c=cache[g.n];if(c&&c.added)vals.push(c.added);});
  var live=state.useLive&&vals.length>0,hi=live?Math.max.apply(null,vals):0;
  ALL.forEach(function(g){
    var c=live?cache[g.n]:null;
    g.mc=g.mc0||(c&&c.mc)||undefined;
    if(live&&c&&c.added){
      var P=100*Math.log1p(c.added)/Math.log1p(hi),cr=[];
      if(g.oc)cr.push([g.oc,.6]);if(g.mc)cr.push([g.mc,.4]);
      var tw=cr.reduce(function(a,x){return a+x[1];},0),C=tw?cr.reduce(function(a,x){return a+x[0]*x[1];},0)/tw:0;
      var w=cr.length===2?.25:cr.length===1?.18:0;
      g.s=Math.round(10*((1-w)*P+w*C))/10;g.src="rawg";g.ra=c.added;g.crit=cr.length;
    } else {g.s=g.s0;g.src=g.src0;g.ra=g.ra0;delete g.crit;}
  });
  state.live=live;
}
function fetchAll(){
  if(state.rbusy)return;
  if(!state.rkey){
    applyScores();render();
    if(state.live)say("Live ranking is on, from cached RAWG data. Save a key to fetch fresh numbers.");else say("Save a key first.",true);
    return;
  }
  var todo=ALL.filter(function(g,i,a){return !cache[g.n]&&a.findIndex(function(o){return o.n===g.n;})===i;});
  if(!todo.length){applyScores();render();say(state.live?"Everything is already cached. Live ranking is on.":"RAWG matched none of these titles, so editorial scores stay.",!state.live);return;}
  state.rbusy=true;state.rprog=0;renderMenu();
  var done=0,consec=0,stop=false,i=0;
  function step(){
    if(stop||i>=todo.length)return Promise.resolve();
    var g=todo[i++];
    return lookup(g.n,state.rkey).then(function(res){cache[g.n]=res;consec=0;}).catch(function(e){
      consec++;
      if(!stop&&(String(e.message)==="429"||consec>=8)){stop=true;explain(e).then(function(m){say(m+" Progress so far is saved.",true);});}
    }).then(function(){
      done++;if(done%20===0)saveCache();
      state.rprog=done/todo.length;var f=document.getElementById("pfill");if(f)f.style.width=(state.rprog*100).toFixed(1)+"%";
      return step();
    });
  }
  Promise.all([step(),step(),step(),step()]).then(function(){
    state.rbusy=false;saveCache();applyScores();render();
    if(!stop)say(state.live?"Done. Ranking now uses live RAWG data.":"Done, but RAWG matched none of these titles.",!state.live);
  });
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act,v=el.dataset.v,g=el.dataset.i!=null?ALL[+el.dataset.i]:null;
  switch(a){
    case "nav":state.view=v;state.q="";document.getElementById("q").value="";break;
    case "plat":var p=state.plats.indexOf(v);if(p>-1)state.plats.splice(p,1);else state.plats.push(v);break;
    case "oc":state.minOc=+v;break;
    case "tier":var ti=state.tiers.indexOf(v);if(ti>-1){if(state.tiers.length===1)state.tiers=["major","notable","other"];else state.tiers.splice(ti,1);}else state.tiers.push(v);break;
    case "clear":state.plats=[];state.minOc=0;state.tiers=["major","notable","other"];break;
    case "open":state.sel=g.i;break;
    case "star":e.stopPropagation();toggleWatch(g);break;
    case "ics":ics([g]);return;
    case "icsAll":ics(ALL.filter(isW));return;
    case "goCal":state.view="cal";if(YEAR===THIS_YEAR)state.m=new Date().getMonth();break;
    case "month":state.view="cal";state.m=+v;state.q="";document.getElementById("q").value="";break;
    case "prev":stepMonth(-1);break;
    case "next":stepMonth(1);break;
    case "todayM":if(YEARS.indexOf(THIS_YEAR)>-1)goYear(THIS_YEAR,new Date().getMonth());else state.m=0;break;
    case "more":state.open[v]=!state.open[v];break;
    case "tba":state.tbaOpen=!state.tbaOpen;break;
    case "clearSearch":state.q="";document.getElementById("q").value="";break;
    case "closeSel":state.sel=null;break;
    case "menu":state.menu=state.menu===v?null:v;break;
    case "closeMenu":state.menu=null;break;
    case "year":goYear(+v,monthFor(+v));state.menu=null;break;
    case "themeL":case "themeD":state.theme=a==="themeD"?"dark":"light";lsSet("rel26.theme",state.theme);applyTheme();break;
    case "accent":setAccent(v);return;
    case "srcEd":state.useLive=false;lsSet("gamecal.useLive","0");applyScores();render();say("Using editorial scores. Your key and cached RAWG data are kept.");return;
    case "fetch":state.useLive=true;lsSet("gamecal.useLive","1");fetchAll();return;
    case "saveKey":
      var k=(document.getElementById("keyInput").value||"").trim();
      if(!k){say("Paste a key first.",true);return;}
      say("Testing key…");
      lookup("Hades",k).then(function(){state.rkey=k;lsSet("gamecal.rawgKey",k);say("Key works and is saved. Press Fetch live ranking.");})
        .catch(function(err){explain(err).then(function(m){say(m,true);});});
      return;
    case "clearKey":
      cache={};state.rkey="";try{localStorage.removeItem("gamecal.rawgKey");localStorage.removeItem("gamecal.rawgCache");}catch(_){}
      applyScores();render();say("Key and cached ranking cleared.");return;
  }
  render();
});
function goYear(y,m){
  if(y!==YEAR){setYear(y);state.open={};state.sel=null;lsSet("rel26.year",String(y));}
  state.m=m;
}
/* month arrows run on into the neighbouring year when we have it */
function canStep(d){var m=state.m+d;return m>=0&&m<=11||YEARS.indexOf(YEAR+d)>-1;}
function stepMonth(d){
  if(!canStep(d))return false;
  var m=state.m+d;
  if(m<0)goYear(YEAR-1,11);else if(m>11)goYear(YEAR+1,0);else state.m=m;
  return true;
}
function setAccent(c){
  state.accent[state.theme]=c;lsSet("rel26.accent",JSON.stringify(state.accent));
  applyTheme();renderSide();renderMenu();
}
document.addEventListener("input",function(e){
  if(e.target.id==="customColor"){state.accent[state.theme]=e.target.value;lsSet("rel26.accent",JSON.stringify(state.accent));applyTheme();renderSide();}
});
document.addEventListener("change",function(e){if(e.target.id==="customColor")renderMenu();});
var qt;
document.getElementById("q").addEventListener("input",function(e){
  clearTimeout(qt);var val=e.target.value;
  qt=setTimeout(function(){state.q=val;render();},120);
});
document.addEventListener("keydown",function(e){
  var inField=/INPUT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName);
  if(e.key==="Escape"){
    if(state.menu)state.menu=null;else if(state.sel!=null)state.sel=null;
    else if(state.q){state.q="";document.getElementById("q").value="";}
    if(inField)document.activeElement.blur();
    render();return;
  }
  if(inField)return;
  if(e.key==="/"||(e.key==="k"&&(e.metaKey||e.ctrlKey))){e.preventDefault();document.getElementById("q").focus();}
  if(state.view==="cal"&&!state.q&&state.sel==null&&!state.menu){
    if(e.key==="ArrowLeft"&&stepMonth(-1))render();
    if(e.key==="ArrowRight"&&stepMonth(1))render();
  }
});
/* live countdown: patch only the digits */
setInterval(function(){
  var cd=document.getElementById("cd");if(!cd)return;
  var p=cdParts(cd.dataset.d),b=cd.querySelectorAll("b");
  for(var i=0;i<4;i++)if(b[i].textContent!==p[i])b[i].textContent=p[i];
},1000);

/* Browsers restore the search box on reload without firing input. */
state.q=document.getElementById("q").value||"";
applyTheme();
applyScores();
render();
</script>
